name: E2E Playwright

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Playwright E2E"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "All E2E tests passed."
            else
              echo "**E2E tests failed.** See the log above and download artifacts for details."
            fi
            echo ""
            echo "| Resource | Link |"
            echo "| --- | --- |"
            echo "| This run | [${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| HTML report (ZIP) | **Artifacts** → \`playwright-report\` on this run (open \`index.html\` locally) |"
            if [ "${GITHUB_REF}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
              echo "| Hosted HTML report | [wojmam.github.io/potoki/playwright-report/](https://wojmam.github.io/potoki/playwright-report/) (updated by **Publish Playwright report** after this workflow) |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
