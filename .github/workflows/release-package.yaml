name: Build Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional; defaults to package.json). Tag is v-prefixed unless already v*."
        required: false
        type: string
      changelog:
        description: "Release notes body (optional; defaults to the matching section in CHANGELOG.md)"
        required: false
        type: string
      release_name:
        description: "Release title (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve release metadata
        id: metadata
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          CHANGELOG_INPUT: ${{ github.event.inputs.changelog }}
          RELEASE_NAME_INPUT: ${{ github.event.inputs.release_name }}
        run: |
          APP_NAME="${GITHUB_REPOSITORY##*/}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            if [[ -z "${VERSION_INPUT}" ]]; then
              VERSION_INPUT="$(node -p "require('./package.json').version")"
            fi
            if [[ "${VERSION_INPUT}" == v* ]]; then
              TAG="${VERSION_INPUT}"
            else
              TAG="v${VERSION_INPUT}"
            fi
          fi

          if [[ -z "${TAG}" ]]; then
            echo "Error: release tag is empty. Push a v* tag, provide version in workflow_dispatch, or set package.json version."
            exit 1
          fi

          SAFE_TAG="$(echo "${TAG}" | sed 's/[^A-Za-z0-9._-]/-/g')"
          VERSION="${TAG#v}"

          RELEASE_NAME="${RELEASE_NAME_INPUT}"
          if [[ -z "${RELEASE_NAME}" ]]; then
            RELEASE_NAME="Release ${TAG}"
          fi

          ZIP_NAME="${APP_NAME}-${SAFE_TAG}.zip"

          if [[ -n "${CHANGELOG_INPUT}" ]]; then
            RELEASE_BODY="${CHANGELOG_INPUT}"
          elif [[ -f CHANGELOG.md ]]; then
            RELEASE_BODY="$(awk -v ver="${VERSION}" '
              /^## \[/ {
                if (found) exit
                if ($0 ~ "\\[" ver "\\]") found=1
                next
              }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d')"
          fi

          if [[ -z "${RELEASE_BODY}" ]]; then
            RELEASE_BODY="See [CHANGELOG.md](CHANGELOG.md) for release notes."
          fi

          {
            echo "tag=${TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "zip_name=${ZIP_NAME}"
            echo "release_body<<RELEASE_BODY_EOF"
            echo "${RELEASE_BODY}"
            echo "RELEASE_BODY_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Package dist directory
        run: |
          if [[ ! -d dist ]]; then
            echo "Error: dist directory not found after build. Ensure the build script outputs files to dist/."
            exit 1
          fi
          cd dist
          zip -r "../${{ steps.metadata.outputs.zip_name }}" .

      - name: Write release notes artifact
        env:
          RELEASE_BODY: ${{ steps.metadata.outputs.release_body }}
        run: printf '%s\n' "$RELEASE_BODY" > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.metadata.outputs.release_body }}
          files: |
            ${{ steps.metadata.outputs.zip_name }}
            RELEASE_NOTES.md
          generate_release_notes: false
