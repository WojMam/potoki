name: Publish Playwright report

on:
  workflow_run:
    workflows:
      - E2E Playwright
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: playwright-report
          path: playwright-report

      - name: Build app and embed report
        run: |
          npm run build
          mkdir -p dist/playwright-report
          cp -r playwright-report/* dist/playwright-report/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        run: |
          {
            echo "## Playwright report published"
            echo ""
            echo "Hosted report: [https://wojmam.github.io/potoki/playwright-report/](https://wojmam.github.io/potoki/playwright-report/)"
            echo ""
            echo "Source E2E run: [workflow run](${{ github.event.workflow_run.html_url }}) (${{ github.event.workflow_run.conclusion }})"
          } >> "${GITHUB_STEP_SUMMARY}"
