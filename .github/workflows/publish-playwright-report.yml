name: Publish Playwright report

on:
  workflow_run:
    workflows:
      - E2E Playwright
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      e2e_run_id:
        description: "E2E Playwright run ID (empty = latest completed run on default branch)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve E2E run ID
        id: e2e-run
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let runId;

            if (context.eventName === 'workflow_run') {
              runId = context.payload.workflow_run.id;
            } else {
              const input = String('${{ inputs.e2e_run_id }}' || '').trim();
              if (input) {
                runId = Number(input);
                if (!Number.isFinite(runId)) {
                  core.setFailed(`Invalid e2e_run_id: ${input}`);
                  return;
                }
              } else {
                const { data: repository } = await github.rest.repos.get({ owner, repo });
                const defaultBranch = repository.default_branch;
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: 'e2e-playwright.yml',
                  branch: defaultBranch,
                  status: 'completed',
                  per_page: 20,
                });
                const run = data.workflow_runs.find(
                  (item) => item.conclusion === 'success' || item.conclusion === 'failure',
                );
                if (!run) {
                  core.setFailed(
                    `No completed E2E Playwright run found on ${defaultBranch}. Run E2E Playwright first.`,
                  );
                  return;
                }
                runId = run.id;
              }
            }

            core.setOutput('run_id', String(runId));

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.e2e-run.outputs.run_id }}
          name: playwright-report
          path: playwright-report

      - name: Build app and embed report
        run: |
          npm run build
          mkdir -p dist/playwright-report
          cp -r playwright-report/* dist/playwright-report/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        env:
          E2E_RUN_ID: ${{ steps.e2e-run.outputs.run_id }}
          E2E_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "## Playwright report published"
            echo ""
            echo "Hosted report: [https://wojmam.github.io/potoki/playwright-report/](https://wojmam.github.io/potoki/playwright-report/)"
            echo ""
            if [ -n "${E2E_RUN_URL}" ]; then
              echo "Source E2E run: [workflow run](${E2E_RUN_URL})"
            else
              echo "Source E2E run ID: \`${E2E_RUN_ID}\` ([open in Actions](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${E2E_RUN_ID}))"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
